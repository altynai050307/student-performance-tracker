name: Student Grades CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Бастапқы кодты алу (Checkout code)
      uses: actions/checkout@v4

    - name: Python ортасын баптау (Set up Python)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Тәуелділіктерді орнату (Install dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Автоматты тестілеуді іске қосу (Run tests)
      run: |
        python -m pytest -v
