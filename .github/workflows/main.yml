name: Build and Test CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Кодты репозиторийден алу (Checkout)
      uses: actions/checkout@v4

    - name: Python ортасын баптау (Set up Python)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Тәуелділіктерді орнату (Install dependencies)
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Синтаксисті тексеру / Linter (Build Check)
      run: |
        python -m py_compile app.py

    - name: Тесттерді автоматты іске қосу (Run Tests)
      run: |
        pytest --verbose
